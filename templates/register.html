<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Smart Farm Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background-color: #f2f9f5;
            background-image: radial-gradient(#198754 1.1px, transparent 1.1px);
            background-size: 28px 28px;
            height: 100vh;
        }
        .card {
            border: 1px solid rgba(25, 135, 84, 0.15);
            border-radius: 1.25rem;
            backdrop-filter: blur(10px);
        }
        .form-control {
            border-radius: 50rem;
            padding-left: 1.25rem;
            padding-right: 1.25rem;
        }
        .form-control:focus {
            border-color: #198754;
            box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.15);
        }
        .badge-pill-custom {
            background-color: #e8f5ec;
            color: #198754;
            border: 1px solid rgba(25, 135, 84, 0.2);
            font-size: 0.8rem;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center">
    <div class="card shadow-lg p-4 p-md-5 bg-white bg-opacity-95" style="width: 440px;">
        <div class="text-center mb-4">
            <span class="badge badge-pill-custom rounded-pill px-3 py-1 mb-3 fw-semibold">🌾 Farmer Registration</span>
            <h3 class="fw-bold text-success">Create Account</h3>
            <p class="text-muted small">Start tracking your smart farm analytics today</p>
        </div>

        {% if error %}
        <div class="alert alert-danger alert-dismissible fade show py-2 small rounded-pill text-center" role="alert">
            <i class="fa-solid fa-triangle-exclamation me-1"></i> {{ error }}
            <button type="button" class="btn-close py-2" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endif %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold text-secondary small ps-2">Choose Username</label>
                <input type="text" name="username" class="form-control bg-light border-0 py-2" placeholder="Choose a unique username" required>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small ps-2">Choose Password</label>
                <input type="password" name="password" class="form-control bg-light border-0 py-2" placeholder="Create a strong password" required>
            </div>
            <button type="submit" class="btn btn-success rounded-pill w-100 py-2 fw-semibold shadow-sm">Register Account</button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted small mb-0">Already have an account? <a href="/login" class="text-success fw-bold text-decoration-none">Login here</a></p>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
